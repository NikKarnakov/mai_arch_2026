services:
  mongodb:
    image: mongo:7
    container_name: hotel-booking-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: hotel_booking_docs
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    container_name: hotel-booking-mongo-api
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  mongo_data:
